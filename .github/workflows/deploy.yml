name: Déploiement Automatique GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions requises pour le déploiement officiel GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'éviter les déploiements concurrents simultanés
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Compilation de l'application
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v5

      - name: Installation des dépendances
        run: npm ci || npm install

      - name: Compilation du projet avec Vite
        run: npm run build

      - name: Téléversement de l'artefact de build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Déploiement en production
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
