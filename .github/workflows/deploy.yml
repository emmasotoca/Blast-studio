name: Déploiement Automatique GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Compilation et Déploiement GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: 4. Compilation du projet (Vite build)
        run: npm run build

      - name: 5. Préparation .nojekyll et 404.html (compatibilité SPA)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: 6. Téléversement de l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 7. Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
