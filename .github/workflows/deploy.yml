name: Déploiement Automatique GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Compilation et Déploiement sur GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: 4. Compilation du projet (Vite build)
        run: npm run build

      - name: 5. Préparation des fichiers pour GitHub Pages (.nojekyll & 404.html)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: 6. Publication sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
